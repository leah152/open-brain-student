<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Open Brain</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brain">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .container { max-width: 680px; margin: 0 auto; }

    header { margin-bottom: 32px; }
    h1 { font-size: 1.5rem; font-weight: 600; color: #fff; }
    .status {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.8rem; color: #555; margin-top: 6px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #333;
      flex-shrink: 0; transition: background 0.3s;
    }
    .dot.connected { background: #22c55e; }
    .dot.error { background: #ef4444; }

    .banner {
      background: #1a0a0a; border: 1px solid #3a1515; border-radius: 10px;
      padding: 16px 18px; margin-bottom: 24px; font-size: 0.875rem;
      color: #f87171; line-height: 1.6; display: none;
    }
    .banner code {
      background: #2a1010; padding: 1px 6px; border-radius: 4px;
      font-size: 0.8rem; font-family: monospace;
    }

    .capture {
      background: #161616; border: 1px solid #222; border-radius: 12px;
      padding: 20px; margin-bottom: 28px;
    }
    textarea {
      width: 100%; background: #0f0f0f; border: 1px solid #252525;
      border-radius: 8px; color: #e5e5e5; font-size: 0.95rem;
      padding: 12px 14px; resize: vertical; min-height: 96px;
      font-family: inherit; outline: none; transition: border-color 0.2s;
      line-height: 1.5;
    }
    textarea:focus { border-color: #6366f1; }
    textarea::placeholder { color: #383838; }
    .row {
      display: flex; align-items: center; gap: 12px; margin-top: 12px;
    }
    button {
      background: #6366f1; color: #fff; border: none; border-radius: 8px;
      padding: 9px 22px; font-size: 0.875rem; font-weight: 500;
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    button:hover:not(:disabled) { background: #5254cc; }
    button:disabled { background: #1e1e1e; color: #444; cursor: not-allowed; }
    .hint { font-size: 0.75rem; color: #444; }
    .save-msg { font-size: 0.8rem; min-height: 16px; }
    .save-msg.ok { color: #22c55e; }
    .save-msg.err { color: #ef4444; }

    .section-label {
      font-size: 0.7rem; font-weight: 600; color: #444;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px;
    }
    .thought {
      background: #161616; border: 1px solid #1e1e1e; border-radius: 10px;
      padding: 16px 18px; margin-bottom: 8px;
    }
    .thought-text { font-size: 0.9rem; color: #ccc; line-height: 1.55; white-space: pre-wrap; }
    .thought-time { font-size: 0.72rem; color: #444; margin-top: 8px; }
    .empty { color: #777; font-size: 0.875rem; text-align: center; padding: 48px 0; }

    .hidden { display: none !important; }
    .mic { background: #222; color: #ddd; padding: 9px 14px; }
    .mic:hover:not(:disabled) { background: #2c2c2c; }
    .mic.listening { background: #ef4444; color: #fff; }
    .search {
      width: 100%; background: #161616; border: 1px solid #222; border-radius: 8px;
      color: #e5e5e5; font-size: 0.9rem; padding: 10px 14px; outline: none;
      font-family: inherit; margin-bottom: 12px;
    }
    .search:focus { border-color: #6366f1; }
    mark { background: #4338ca; color: #fff; border-radius: 3px; padding: 0 2px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .link-btn {
      background: none; color: #888; padding: 4px 0; font-size: 0.8rem; font-weight: 400;
    }
    .link-btn:hover:not(:disabled) { background: none; color: #ccc; }
    .auth {
      background: #161616; border: 1px solid #222; border-radius: 12px;
      padding: 24px 20px; max-width: 400px;
    }
    .auth h2 { font-size: 1.05rem; color: #fff; font-weight: 600; margin-bottom: 4px; }
    .auth p { font-size: 0.8rem; color: #666; margin-bottom: 18px; line-height: 1.5; }
    .auth label { display: block; font-size: 0.75rem; color: #888; margin: 12px 0 6px; }
    .auth input {
      width: 100%; background: #0f0f0f; border: 1px solid #252525; border-radius: 8px;
      color: #e5e5e5; font-size: 0.95rem; padding: 11px 14px; outline: none; font-family: inherit;
    }
    .auth input:focus { border-color: #6366f1; }
    .auth .row { margin-top: 18px; flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="container">

  <header class="topbar">
    <div>
      <h1>🧠 My Open Brain</h1>
      <div class="status">
        <div class="dot" id="dot"></div>
        <span id="statusText">Connecting...</span>
      </div>
    </div>
    <button class="link-btn hidden" id="signOutBtn" onclick="signOut()">Sign out</button>
  </header>

  <div class="banner" id="banner"></div>

  <form class="auth hidden" id="authBox" onsubmit="event.preventDefault(); submitAuth()">
    <h2 id="authTitle">Sign in</h2>
    <p>Your brain is private. Only you can see what's in it.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" minlength="8" required>
    <div class="row">
      <button type="submit" id="authBtn">Sign in</button>
      <button type="button" class="link-btn" id="authToggle" onclick="toggleMode()">New here? Create account</button>
    </div>
    <div class="save-msg" id="authMsg" style="margin-top:12px"></div>
  </form>

  <div id="app" class="hidden">
  <div class="capture">
    <textarea id="input" placeholder="Capture anything — ideas, notes, things you learned, questions, plans..." rows="4"></textarea>
    <div class="row">
      <button id="saveBtn" onclick="save()" disabled>Save to Brain</button>
      <button type="button" class="mic hidden" id="micBtn" onclick="toggleMic()" title="Speak a thought">🎤 Speak</button>
      <span class="hint">or Ctrl+Enter</span>
      <span class="save-msg" id="saveMsg"></span>
    </div>
  </div>

  <input class="search" id="search" type="search" placeholder="Search everything you've saved..." autocomplete="off">
  <div class="section-label" id="listLabel">Recent Thoughts</div>
  <div id="list"><div class="empty">Loading...</div></div>
  </div>

</div>
<script>
  let db = null
  let user = null
  let mode = 'signin'
  const $ = id => document.getElementById(id)

  function showBanner(html) {
    const b = document.getElementById('banner')
    b.innerHTML = html
    b.style.display = 'block'
    document.getElementById('dot').className = 'dot error'
    document.getElementById('statusText').textContent = 'Not connected'
  }

  async function init() {
    if (typeof SUPABASE_URL === 'undefined' || SUPABASE_URL.includes('PASTE_YOUR')) {
      showBanner('Setup not complete. Open <code>config.js</code> and replace the two placeholder values with your Supabase URL and anon key.')
      document.getElementById('list').innerHTML = ''
      return
    }
    try {
      db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      db.auth.onAuthStateChange((_event, session) => {
        // Defer so Supabase finishes its own auth work before we query
        setTimeout(() => render(session), 0)
      })
      const { data } = await db.auth.getSession()
      render(data.session)
    } catch (e) {
      showBanner('Could not connect to your database.<br><br>Error: <code>' + e.message + '</code><br><br>Check that your URL and anon key in <code>config.js</code> are correct and that you ran the migration SQL in Supabase.')
      document.getElementById('list').innerHTML = ''
    }
  }

  let shownUserId
  async function render(session) {
    const next = session ? session.user : null
    if ((next && next.id) === shownUserId) return
    shownUserId = next && next.id
    user = next
    $('banner').style.display = 'none'
    if (!user) {
      $('app').classList.add('hidden')
      $('signOutBtn').classList.add('hidden')
      $('authBox').classList.remove('hidden')
      $('dot').className = 'dot'
      $('statusText').textContent = 'Signed out'
      return
    }
    $('authBox').classList.add('hidden')
    $('app').classList.remove('hidden')
    $('signOutBtn').classList.remove('hidden')
    $('dot').className = 'dot connected'
    $('statusText').textContent = 'Signed in as ' + user.email
    $('saveBtn').disabled = false
    await load()
  }

  function toggleMode() {
    mode = mode === 'signin' ? 'signup' : 'signin'
    const up = mode === 'signup'
    $('authTitle').textContent = up ? 'Create your account' : 'Sign in'
    $('authBtn').textContent = up ? 'Create account' : 'Sign in'
    $('authToggle').textContent = up ? 'Have an account? Sign in' : 'New here? Create account'
    $('password').autocomplete = up ? 'new-password' : 'current-password'
    $('authMsg').textContent = ''
  }

  async function submitAuth() {
    const email = $('email').value.trim()
    const password = $('password').value
    const btn = $('authBtn'), msg = $('authMsg')
    btn.disabled = true
    msg.textContent = ''
    msg.className = 'save-msg'
    try {
      const { data, error } = mode === 'signup'
        ? await db.auth.signUp({ email, password })
        : await db.auth.signInWithPassword({ email, password })
      if (error) throw error
      if (mode === 'signup' && !data.session) {
        msg.textContent = 'Account created. Check your email to confirm, then sign in.'
        msg.className = 'save-msg ok'
      }
    } catch (e) {
      msg.textContent = '✗ ' + e.message
      msg.className = 'save-msg err'
    } finally {
      btn.disabled = false
    }
  }

  async function signOut() {
    await db.auth.signOut()
  }

  async function save() {
    const input = document.getElementById('input')
    const text = input.value.trim()
    if (!text) return
    const btn = document.getElementById('saveBtn')
    const msg = document.getElementById('saveMsg')
    btn.disabled = true
    btn.textContent = 'Saving...'
    msg.textContent = ''
    msg.className = 'save-msg'
    try {
      const { error } = await db.from('thoughts').insert({ content: text, user_id: user.id })
      if (error) throw error
      input.value = ''
      msg.textContent = '✓ Saved'
      msg.className = 'save-msg ok'
      await load()
    } catch (e) {
      msg.textContent = '✗ ' + e.message
      msg.className = 'save-msg err'
    } finally {
      btn.disabled = false
      btn.textContent = 'Save to Brain'
    }
  }

  async function load() {
    const list = document.getElementById('list')
    const term = $('search').value.trim()
    $('listLabel').textContent = term ? 'Search results' : 'Recent Thoughts'
    try {
      let q = db.from('thoughts').select('*')
      if (term) q = q.ilike('content', '%' + term.replace(/[%_\\]/g, m => '\\' + m) + '%')
      const { data, error } = await q.order('created_at', { ascending: false }).limit(term ? 100 : 20)
      if (error) throw error
      if (!data || data.length === 0) {
        list.innerHTML = '<div class="empty">' + (term ? 'Nothing matches "' + esc(term) + '".' : 'No thoughts yet. Write something above.') + '</div>'
        return
      }
      list.innerHTML = data.map(t => `
        <div class="thought">
          <div class="thought-text">${highlight(esc(t.content), term)}</div>
          <div class="thought-time">${fmt(t.created_at)}</div>
        </div>`).join('')
    } catch (e) {
      list.innerHTML = '<div class="empty" style="color:#ef4444">Could not load: ' + e.message + '</div>'
    }
  }

  document.getElementById('input').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') save()
  })

  let searchTimer
  $('search').addEventListener('input', () => {
    clearTimeout(searchTimer)
    searchTimer = setTimeout(load, 250)
  })

  function highlight(html, term) {
    if (!term) return html
    const t = esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    return html.replace(new RegExp(t, 'gi'), m => '<mark>' + m + '</mark>')
  }

  // Voice capture: browser speech-to-text, nothing leaves except to the browser's own engine
  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition
  let rec = null, listening = false
  if (Speech) $('micBtn').classList.remove('hidden')
  function toggleMic() {
    if (listening) { rec.stop(); return }
    rec = new Speech()
    rec.lang = 'en-US'
    rec.interimResults = true
    rec.continuous = true
    const input = $('input')
    const before = input.value ? input.value.replace(/\s*$/, ' ') : ''
    rec.onresult = e => {
      let text = ''
      for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript
      input.value = before + text
    }
    rec.onerror = e => {
      $('saveMsg').textContent = '✗ Mic: ' + e.error
      $('saveMsg').className = 'save-msg err'
    }
    rec.onend = () => {
      listening = false
      $('micBtn').classList.remove('listening')
      $('micBtn').textContent = '🎤 Speak'
    }
    rec.start()
    listening = true
    $('micBtn').classList.add('listening')
    $('micBtn').textContent = '■ Stop'
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }
  function fmt(iso) {
    return new Date(iso).toLocaleString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    })
  }

  init()
</script>
</body>
</html>
